name: Check

# Bei jedem PR und jedem Push auf main: Unit-Tests, Lint (nur Errors brechen ab) und Debug-Build.
# Feature-Branches laufen über ihren PR, so gibt es pro Commit genau einen Lauf.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ein neuer Push auf denselben Branch bricht den laufenden Check ab.
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, Lint, Debug-Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Nur main schreibt den Cache, Feature-Branches lesen ihn nur.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Tests, Lint, Debug-Build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Lint-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Test-Reports hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
